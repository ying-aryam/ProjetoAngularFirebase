<ion-content [fullscreen]="true">
    
    <ion-row class="ion-justify-content-center">
        <ion-col size="auto">
            <h1>{{this.data_selecionada }}</h1>
            <ion-datetime (ionChange)="definerData($event)"></ion-datetime>
        </ion-col>
    </ion-row>
    
    <!--Calculando dias de vida-->
    <ion-row class="ion-justify-content-center">
        <ion-col size="auto">
            <h1>Voce viveu {{this.dias_vividos}}</h1>
        </ion-col>
        <ion-col size="auto">
            <h1>selecione a data de nascimento</h1>
            <ion-datetime (ionChange)="definerDataInicial($event)"></ion-datetime>
        </ion-col>

        <ion-col size="auto">
            <h1>selecione a data atual</h1>
            <ion-datetime (ionChange)="definerDataAtual($event)"></ion-datetime>
        </ion-col>
    </ion-row>
    
</ion-content>
